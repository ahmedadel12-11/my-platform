<script>
"use strict";

/* إعداد الاتصال */
const SUPABASE_URL="https://vpppdppyuvpfawtvmyph.supabase.co";
const SUPABASE_KEY="sb_publishable_S_-TuxVqSsmLQmEMtL6IAA_oUXtEiM3";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let user=null,role=null,profile=null;
const $=id=>document.getElementById(id);

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function setContent(html){$("content").innerHTML=html;}

function message(id,text,error=false){
 const el=$(id);
 if(!el)return;
 el.className=error?"msg error":"msg";
 el.textContent=text;
}

function errorBox(error){
 return `<div class="msg error">${esc(error?.message||error||"حدث خطأ")}</div>`;
}

function isTeacher(){return role==="teacher";}

function requireTeacher(){
 if(!isTeacher()){
  setContent("<h2>غير مسموح بالدخول</h2>");
  return false;
 }
 return true;
}

function requireStudent(){
 if(role!=="student"){
  setContent("<h2>غير مسموح بالدخول</h2>");
  return false;
 }
 return true;
}

/* تسجيل النشاط */
async function logActivity(activity,details=""){
 if(!user)return;
 const {error}=await db.from("activity_logs").insert({
  user_id:user.id,activity,details
 });
 if(error)console.warn("Activity log:",error.message);
}

/* تسجيل الدخول */
async function login(){
 const u=$("username").value.trim().toLowerCase();
 const p=$("password").value;

 if(!/^[a-z0-9._-]{3,32}$/.test(u)||!p){
  message("loginMsg","اكتب اسم المستخدم وكلمة المرور بشكل صحيح",true);
  return;
 }

 /* حساب المدرس الحالي */
 const email=u==="mrahmedadel"
  ?"boda@students.example.com"
  :u+"@students.example.com";

 const {data,error}=await db.auth.signInWithPassword({
  email,password:p
 });

 if(error){
  message("loginMsg","بيانات الدخول غير صحيحة",true);
  return;
 }

 await start(data.user);
}

/* بدء الجلسة */
async function start(authUser){
 user=authUser;

 const r=await db.from("user_roles")
  .select("role")
  .eq("user_id",user.id)
  .maybeSingle();

 if(r.error||!r.data){
  await db.auth.signOut();
  user=null;
  message("loginMsg","الحساب غير مفعل أو لا توجد صلاحية",true);
  return;
 }

 role=r.data.role;

 if(!["teacher","student"].includes(role)){
  await db.auth.signOut();
  user=null;
  return;
 }

 const p=await db.from("profiles")
  .select("*")
  .eq("id",user.id)
  .maybeSingle();

 if(p.error){
  alert("تعذر تحميل الملف الشخصي: "+p.error.message);
  return;
 }

 profile=p.data;

 $("login").classList.add("hidden");
 $("dashboard").classList.remove("hidden");
 $("welcome").textContent="أهلاً بك "+(profile?.full_name||"في المنصة");
 $("roleLabel").textContent=isTeacher()?"لوحة تحكم المدير":"حساب الطالب";

 buildMenu();
 home();
 await logActivity("تسجيل الدخول","فتح المنصة");
}

  ["الدرجات اليدوية","manualGrades"],

  ["سجل النشاط","activities"],
  ["الإعلانات","announcements"],
  ["النتائج","results"],
  ["إعدادات المدير","settings"]
 ];

 const student=[
  ["الرئيسية","home"],
  ["الدروس","lessons"],
  ["الامتحانات","studentExams"],
  ["حضوري وإنذاراتي","myAttendance"],
  ["نتائجي","myResults"],
  ["طلب تغيير كلمة المرور","requestPassword"],
  ["الإعلانات","announcements"],

 $("menu").innerHTML=(isTeacher()?teacher:student).map(x=>

function home(){
 setContent(`
  <h2>أهلاً بك في منصة مستر أحمد عادل</h2>
  <p>التاريخ والجغرافيا والمراجعات والامتحانات.</p>
  <div class="item">تابع الدروس والامتحانات والنتائج من مكان واحد.</div>
 `);
}

function openPage(page){
 const teacherPages=[
  "students","attendance","exams","manualGrades",
  "resetRequests","activities","results"
 ];

 const studentPages=[
  "studentExams","myAttendance","myResults","requestPassword"
 ];

 if(teacherPages.includes(page)&&!isTeacher()){
  home();return;
 }

 if(studentPages.includes(page)&&role!=="student"){
  home();return;
 }

 const pages={
  home,
  students:studentsPage,
  lessons:lessonsPage,
  attendance:attendancePage,
  exams:examsPage,
  studentExams:studentExamsPage,
  announcements:announcementsPage,
  results:resultsPage,
  myResults:myResultsPage,
  myAttendance:myAttendancePage,
  manualGrades:manualGradesPage,

  requestPassword:requestPasswordPage,
  activities:activitiesPage,
  settings:settingsPage
 };

 if(pages[page])pages[page]();
 else home();
}

/* الطلاب */
async function getStudents(){
 const r=await db.from("user_roles")
  .select("user_id")
  .eq("role","student");

 if(r.error)throw r.error;

 const ids=(r.data||[]).map(x=>x.user_id);
 if(!ids.length)return [];

 const p=await db.from("profiles")
  .select("id,full_name,username")
  .in("id",ids)
  .order("full_name");

 if(p.error)throw p.error;
 return p.data||[];
}

async function studentsPage(){
 if(!requireTeacher())return;

 setContent(`
  <h2>إدارة الطلاب</h2>
  <input id="studentName" placeholder="اسم الطالب بالكامل">
  <input id="studentUsername" placeholder="اسم المستخدم بالإنجليزية">
  <input id="studentPassword" type="password" placeholder="كلمة المرور">
  <button onclick="createStudent()">إنشاء حساب طالب</button>
  <div id="studentList"></div>
 `);

 try{
  const students=await getStudents();

  $("studentList").innerHTML=students.map(s=>
   `<div class="item">${esc(s.full_name)} — ${esc(s.username)}</div>`
  ).join("")||"<p>لا يوجد طلاب.</p>";

 }catch(e){
  $("studentList").innerHTML=errorBox(e);
 }
}

async function createStudent(){
 if(!requireTeacher())return;

 const full_name=$("studentName").value.trim();
 const username=$("studentUsername").value.trim().toLowerCase();
 const password=$("studentPassword").value;

 if(!full_name||!/^[a-z0-9._-]{3,32}$/.test(username)||password.length<8){
  alert("راجع الاسم واسم المستخدم وكلمة المرور (8 أحرف على الأقل).");
  return;
 }

 const {data:{session}}=await db.auth.getSession();

 if(!session){
  alert("انتهت الجلسة، سجل الدخول مرة أخرى.");
  return;
 }

 try{
  const res=await fetch(SUPABASE_URL+"/functions/v1/create-student",{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer "+session.access_token,
    "apikey":SUPABASE_KEY
   },
   body:JSON.stringify({full_name,username,password})
  });

  const out=await res.json();

  if(!res.ok){
   alert(out.error||out.message||"فشل إنشاء الطالب");
   return;
  }

  alert("تم إنشاء حساب الطالب.");
  await logActivity("إنشاء طالب",username);
  studentsPage();

 }catch(e){
  alert("تعذر الاتصال بوظيفة إنشاء الطالب: "+e.message);
 }
}

async function saveAttendance(){
 if(!requireTeacher())return;

 const student_id=$("attStudent").value;
 const class_date=$("attDate").value;
 const status=$("attStatus").value;

 if(!student_id||!class_date){
  alert("اختر الطالب وتاريخ الحصة.");
  return;
 }

 const student=await db.from("profiles")
  .select("full_name")
  .eq("id",student_id)
  .single();

 if(student.error){
  alert(student.error.message);
  return;
 }

 const r=await db.from("attendance").insert({
  student_id,
  student_name:student.data.full_name,
  class_date,
  status
 });

 if(r.error){
  alert(r.error.message);
  return;
 }

 /* إنذار واحد فقط عند الوصول إلى 3 مرات غياب */
 if(status==="absent"){
  const count=await db.from("attendance")
   .select("id",{count:"exact",head:true})
   .eq("student_id",student_id)
   .eq("status","absent");

  if(count.error){
   alert("تم تسجيل الغياب، لكن تعذر حساب مرات الغياب: "+count.error.message);
  }else if((count.count||0)>=3){

   const oldWarning=await db.from("absence_warnings")
    .select("id")
    .eq("student_id",student_id)
    .limit(1);

   if(!oldWarning.error&&(!oldWarning.data||oldWarning.data.length===0)){
    const warning=await db.from("absence_warnings").insert({
     student_id,
     absence_count:count.count,
     warning_number:1,
     warning_message:"تنبيه: وصل عدد مرات الغياب إلى 3 حصص."
    });

    if(warning.error){
     alert("تم تسجيل الغياب، لكن تعذر إنشاء الإنذار: "+warning.error.message);
    }
   }
  }
 }

 alert("تم تسجيل الحضور بنجاح.");
 await logActivity("تسجيل حضور",student.data.full_name+" - "+status);
 attendancePage();
}

async function addExam(){
 if(!requireTeacher())return;

 const title=$("examTitle").value.trim();

 if(!title){
  alert("اكتب اسم الامتحان.");
  return;
 }

 const r=await db.from("exams").insert({
  title,
  subject:$("examSubject").value,
  grade:$("examGrade").value.trim(),
  is_active:true
 });

 if(r.error){
  alert(r.error.message);
  return;
 }

 await logActivity("إنشاء امتحان",title);

}

async function addQuestion(){
 if(!requireTeacher())return;

 const exam_id=Number($("examSelect").value);
 const question_text=$("qText").value.trim();
 const options=[
  $("o0").value,
  $("o1").value,
  $("o2").value,
  $("o3").value
 ];

 if(!exam_id||!question_text||options.some(x=>!x.trim())){
  alert("أكمل السؤال والاختيارات.");
  return;
 }

 const r=await db.from("questions").insert({
  exam_id,
  question_text,
  options,
  correct_answer:$("correct").value
 });

 if(r.error){
  alert(r.error.message);
  return;
 }

 alert("تمت إضافة السؤال.");
 await logActivity("إضافة سؤال",question_text);
}

/* امتحانات الطالب */
async function studentExamsPage(){
 if(!requireStudent())return;

 const r=await db.from("exams")
  .select("*")
  .eq("is_active",true)
  .order("created_at",{ascending:false});

 if(r.error){
  setContent(errorBox(r.error));
  return;
 }

 setContent("<h2>الامتحانات المتاحة</h2>"+
  ((r.data||[]).map(x=>`
   <div class="item">
    ${esc(x.title)}
    <button onclick="startExam(${Number(x.id)})">ابدأ الامتحان</button>
   </div>
  `).join("")||"<p>لا توجد امتحانات متاحة.</p>")
 );
}

async function startExam(id){
 if(!requireStudent())return;

 const r=await db.from("questions")
  .select("id,question_text,options")
  .eq("exam_id",id);

 if(r.error){
  setContent(errorBox(r.error));
  return;
 }

 const qs=r.data||[];

 if(!qs.length){
  alert("لا توجد أسئلة لهذا الامتحان.");
  return;
 }

 setContent(`
  <h2>الامتحان</h2>
  <form id="examForm">
   ${qs.map((q,i)=>`
    <div class="item">
     <b>${i+1}. ${esc(q.question_text)}</b>
     ${(Array.isArray(q.options)?q.options:[]).map((o,j)=>`
      <label>
       <input style="width:auto" type="radio" name="q${q.id}" value="${j}" required>
       ${esc(o)}
      </label>
     `).join("")}
    </div>
   `).join("")}
   <button type="submit">تسليم الامتحان</button>
  </form>
 `);

 $("examForm").onsubmit=async e=>{
  e.preventDefault();

  const answers={};
  qs.forEach(q=>{
   answers[q.id]=new FormData(e.target).get("q"+q.id);
  });

  const result=await db.rpc("submit_exam",{
   p_exam_id:id,
   p_answers:answers
  });

  if(result.error){
   alert(result.error.message);
   return;
  }

  alert("تم تسليم الامتحان. درجتك: "+result.data+"%");
  await logActivity("تسليم امتحان",String(id));
  myResultsPage();
 };
}

   <input id="annTitle" placeholder="عنوان الإعلان">

   <button onclick="publishAnnouncement()">نشر الإعلان</button>
   <hr>`:""}
  <h2>الإعلانات</h2>
  <div id="annList">جار التحميل...</div>
 `);

 const r=await db.from("announcements")
  .select("*")
  .order("created_at",{ascending:false});

 if(r.error){
  $("annList").innerHTML=errorBox(r.error);
  return;
 }

 $("annList").innerHTML=(r.data||[]).map(x=>`
  <div class="item">
   <h3>${esc(x.title)}</h3>
   <p>${esc(x.message)}</p>
  </div>
 `).join("")||"لا توجد إعلانات.";
}

async function publishAnnouncement(){
 if(!requireTeacher())return;

 const title=$("annTitle").value.trim();
 const messageText=$("annMessage").value.trim();

 if(!title||!messageText){
  alert("اكتب عنوان الإعلان ونصه.");
  return;
 }

 const r=await db.from("announcements").insert({
  title,message:messageText
 });

 if(r.error){
  alert(r.error.message);
  return;
 }

 await logActivity("نشر إعلان",title);
 announcementsPage();
}

/* الدرجات اليدوية */
async function manualGradesPage(){
 if(!requireTeacher())return;

 let students;

 try{
  students=await getStudents();
 }catch(e){
  setContent(errorBox(e));
  return;
 }

 const r=await db.from("manual_grades")
  .select("id,student_id,exam_title,subject,grade,max_grade,exam_date,notes,created_at")
  .order("created_at",{ascending:false});

 if(r.error){
  setContent(errorBox(r.error));
  return;
 }

 setContent(`
  <h2>إضافة درجة يدوية</h2>

  <label>الطالب</label>
  <select id="mgStudent">
   ${students.map(s=>
    `<option value="${s.id}">${esc(s.full_name)}</option>`
   ).join("")}
  </select>

  <input id="mgTitle" placeholder="اسم الامتحان أو التقييم">
  <input id="mgSubject" placeholder="المادة">
  <input id="mgGrade" type="number" step="0.01" placeholder="الدرجة">
  <input id="mgMax" type="number" step="0.01" value="100" placeholder="النهاية الكبرى">
  <input id="mgDate" type="date">
  <textarea id="mgNotes" placeholder="ملاحظات"></textarea>
  <button onclick="saveManualGrade()">حفظ الدرجة</button>

  <hr>
  <h2>الدرجات المسجلة</h2>

  ${(r.data||[]).map(x=>`
   <div class="item">
    الطالب: ${esc(students.find(s=>s.id===x.student_id)?.full_name||x.student_id)}
    <br>${esc(x.exam_title)} — ${esc(x.subject)}
    <br>الدرجة: ${esc(x.grade)} من ${esc(x.max_grade)}
    <br>${esc(x.exam_date||"")}
    <br>${esc(x.notes||"")}
   </div>
  `).join("")||"<p>لا توجد درجات.</p>"}
 `);
}

async function saveManualGrade(){
 if(!requireTeacher())return;

 const grade=Number($("mgGrade").value);
 const max_grade=Number($("mgMax").value);

 if(
  !$("mgTitle").value.trim()||
  !Number.isFinite(grade)||
  !Number.isFinite(max_grade)||
  max_grade<=0||
  grade<0||
  grade>max_grade||
  !$("mgStudent").value
 ){
  alert("راجع اسم التقييم والطالب والدرجة والنهاية الكبرى.");
  return;
 }

 const row={
  student_id:$("mgStudent").value,
  exam_title:$("mgTitle").value.trim(),
  subject:$("mgSubject").value.trim(),
  grade,
  max_grade,
  exam_date:$("mgDate").value||null,
  notes:$("mgNotes").value.trim(),
  created_by:user.id
 };

 const r=await db.from("manual_grades").insert(row);

 if(r.error){
  alert(r.error.message);
  return;
 }

 alert("تم حفظ الدرجة.");
 await logActivity("إضافة درجة يدوية",row.exam_title);
 manualGradesPage();
}

async function rejectResetRequest(id){
 if(!requireTeacher())return;

 const r=await db.from("password_reset_requests")
  .update({

  .eq("id",id);

  return;

 resetRequestsPage();

/* إعدادات الحساب */
async function settingsPage(){
 setContent(`
  <h2>إعدادات الحساب</h2>

  <label>الاسم بالكامل</label>
  <input id="settingsName" value="${esc(profile?.full_name||"")}">

  <label>اسم المستخدم</label>
  <input id="settingsUsername" value="${esc(profile?.username||"")}" readonly>
  <p class="small">تغيير اسم المستخدم يحتاج تحديث بيانات تسجيل الدخول أيضًا، لذلك تم إيقاف تعديله من هنا مؤقتًا.</p>

  <button onclick="saveProfile()">حفظ الاسم</button>

  <hr>
  <h2>تغيير كلمة المرور</h2>
  <input id="newPassword" type="password" placeholder="كلمة المرور الجديدة">
  <input id="confirmPassword" type="password" placeholder="تأكيد كلمة المرور">
  <button onclick="changeOwnPassword()">تغيير كلمة المرور</button>
 `);
}

async function saveProfile(){
 const full_name=$("settingsName").value.trim();

 if(!full_name){
  alert("اكتب الاسم.");
  return;
 }

 const r=await db.from("profiles")
  .update({full_name})
  .eq("id",user.id);

 if(r.error){
  alert(r.error.message);
  return;
 }

 profile={...profile,full_name};
 $("welcome").textContent="أهلاً بك "+full_name;

 alert("تم تحديث الاسم.");
 await logActivity("تعديل الاسم",full_name);
}

async function changeOwnPassword(){
 const p=$("newPassword").value;
 const c=$("confirmPassword").value;

 if(p.length<8){
  alert("كلمة المرور يجب أن تكون 8 أحرف على الأقل.");
  return;
 }

 if(p!==c){
  alert("كلمتا المرور غير متطابقتين.");
  return;
 }

 const r=await db.auth.updateUser({password:p});

 if(r.error){
  alert(r.error.message);
  return;
 }

 alert("تم تغيير كلمة المرور بنجاح.");
 $("newPassword").value="";
 $("confirmPassword").value="";

 await logActivity("تغيير كلمة المرور");
}

/* تسجيل الخروج واستعادة الجلسة */
async function logout(){
 await logActivity("تسجيل الخروج");
 await db.auth.signOut();
 location.reload();
}

db.auth.getSession().then(({data,error})=>{
 if(!error&&data.session){
  start(data.session.user);
 }
});
