<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - المنصة التعليمية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #555; }
        .toggle-btn { background: none; color: #007bff; border: none; cursor: pointer; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="box">
    <h2 id="form-title">تسجيل دخول المنصة</h2>
    
    <!-- نموذج الدخول أو التسجيل -->
    <form id="authForm">
        <input type="text" id="username" placeholder="اسم المستخدم أو الكود" required>
        <input type="password" id="password" placeholder="كلمة السر" required>
        <button type="submit" id="submitBtn">دخول المنصة</button>
    </form>

    <!-- زرار للتبديل بين التسجيل والدخول -->
    <button class="toggle-btn" onclick="toggleMode()">ليس لديك حساب؟ اضغط هنا للتسجيل</button>
</div>

<script>
    let isRegistering = false;

    function toggleMode() {
        isRegistering = !isRegistering;
        document.getElementById("form-title").innerText = isRegistering ? "إنشاء حساب جديد" : "تسجيل دخول المنصة";
        document.getElementById("submitBtn").innerText = isRegistering ? "حفظ وتسجيل" : "دخول المنصة";
        document.querySelector(".toggle-btn").innerText = isRegistering ? "لديك حساب بالفعل؟ سجل دخولك" : "ليس لديك حساب؟ اضغط هنا للتسجيل";
    }

    document.getElementById("authForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const user = document.getElementById("username").value.trim();
        const pass = document.getElementById("password").value.trim();

        // حساب المدير الخاص بك
        const adminUser = "teacher";
        const adminPass = "9999";

        if (user === adminUser && pass === adminPass) {
            alert("أهلاً بك يا أستاذنا، تم تسجيل الدخول كمدير للمنصة بنجاح!");
            localStorage.setItem("currentStudent", "المدير (" + user + ")");
            window.location.href = "index.html"; 
            return;
        }

        // الحسابات المحفوظة للطلاب
        let usersList = JSON.parse(localStorage.getItem("studentsList")) || [];

        if (isRegistering) {
            const userExists = usersList.find(s => s.username === user);
            if (userExists || user === adminUser) {
                alert("اسم المستخدم هذا محجوز أو موجود بالفعل، اختر اسم آخر.");
                return;
            }
            usersList.push({ username: user, password: pass });
            localStorage.setItem("studentsList", JSON.stringify(usersList));
            
            alert("تم إنشاء الحساب وحفظه بنجاح! يمكنك الآن تسجيل الدخول.");
            toggleMode(); 
        } else {
            const foundUser = usersList.find(s => s.username === user && s.password === pass);
            if (foundUser) {
                alert("أهلاً بك، تم تسجيل الدخول بنجاح!");
                localStorage.setItem("currentStudent", user);
                window.location.href = "index.html"; 
            } else {
                alert("خطأ في اسم المستخدم أو كلمة السر!");
            }
        }
    });
</script>

</body>
</html>
