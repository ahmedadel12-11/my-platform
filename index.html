
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة مستر أحمد عادل التعليمية</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:linear-gradient(135deg,#10131c,#202b3d);
color:white;
min-height:100vh;
padding:20px;
display:flex;
justify-content:center;
align-items:center
}
.container{
width:100%;
max-width:460px;
background:#1b2030;
padding:28px;
border-radius:20px;
border:1px solid #424a5d;
box-shadow:0 15px 50px #0007
}
h1{text-align:center;color:#f6a623}
.subtitle{text-align:center;color:#c4cad5;line-height:1.8}
input{
width:100%;
padding:15px;
margin:9px 0;
border:1px solid #41495e;
border-radius:10px;
background:#111725;
color:white;
font-size:16px
}
button{
width:100%;
padding:15px;
margin-top:12px;
border:0;
border-radius:10px;
background:#f6a623;
color:#171717;
font-weight:bold;
font-size:16px;
cursor:pointer
}
.secondary{background:#354159;color:white}
.hidden{display:none!important}
#message{text-align:center;color:#ffc35c;line-height:1.8}
.card{
background:#283247;
padding:20px;
border-radius:14px;
margin:15px 0;
border-right:4px solid #f6a623
}
</style>
</head>

<body>
<div class="container">

<section id="login">
<h1>مستر أحمد عادل</h1>
<p class="subtitle">منصتك التعليمية للتاريخ والجغرافيا</p>

<input id="fullName" type="text" placeholder="الاسم بالكامل">
<input id="username" type="text" placeholder="اسم المستخدم">
<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">تسجيل الدخول</button>
<button id="signupBtn" class="secondary">إنشاء حساب طالب جديد</button>

<p id="message"></p>
</section>

<section id="dashboard" class="hidden">
<h1>أهلاً بك في المنصة</h1>
<p class="subtitle" id="studentName"></p>

<div class="card">
<h3>📚 التاريخ</h3>
<p>قسم التاريخ والمراجعات التعليمية</p>
</div>

<div class="card">
<h3>🌍 الجغرافيا</h3>
<p>قسم الجغرافيا والمراجعات التعليمية</p>
</div>

<div class="card">
<h3>📝 الامتحانات</h3>
<p>الامتحانات والنتائج ستظهر هنا بعد إعدادها.</p>
</div>

<button id="logoutBtn">تسجيل الخروج</button>
</section>

</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL =
'https://vpppdppyuvpfawtvmyph.supabase.co';

const SUPABASE_KEY =
'sb_publishable_S_-TuxVqSsmLQmEMtL6IAA_oUXtEiM3';

const supabase = createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const login = document.getElementById('login');
const dashboard = document.getElementById('dashboard');
const message = document.getElementById('message');

function makeEmail(username){
return username.toLowerCase() + '@students.example.com';
}

function showDashboard(user){
login.classList.add('hidden');
dashboard.classList.remove('hidden');

const name = user.user_metadata?.full_name ||
user.user_metadata?.username || 'طالب';

document.getElementById('studentName').textContent =
'أهلاً بك يا ' + name;
}

document.getElementById('signupBtn').onclick =
async function(){

const fullName =
document.getElementById('fullName').value.trim();

const username =
document.getElementById('username').value.trim().toLowerCase();

const password =
document.getElementById('password').value;

if(!fullName || !username || !password){
message.textContent='من فضلك أكمل جميع البيانات';
return;
}

if(!/^[a-z0-9_]{3,20}$/.test(username)){
message.textContent='اسم المستخدم يجب أن يكون 3 إلى 20 حرفاً أو رقماً باللغة الإنجليزية';
return;
}

if(password.length < 8){
message.textContent='كلمة المرور يجب ألا تقل عن 8 أحرف';
return;
}

message.textContent='جارٍ إنشاء الحساب...';

const {data,error}=await supabase.auth.signUp({
email:makeEmail(username),
password:password,
options:{
data:{
full_name:fullName,
username:username
}
}
});

if(error){
message.textContent='تعذر إنشاء الحساب: '+error.message;
return;
}

if(data.session){
showDashboard(data.user);
message.textContent='';
}else{
message.textContent=
'تم إنشاء الحساب. يجب مراجعة إعداد تأكيد البريد الإلكتروني في Supabase قبل تسجيل الدخول.';
}
};

document.getElementById('loginBtn').onclick =
async function(){

const username =
document.getElementById('username').value.trim().toLowerCase();

const password =
document.getElementById('password').value;

if(!username || !password){
message.textContent='اكتب اسم المستخدم وكلمة المرور';
return;
}

if(!/^[a-z0-9_]{3,20}$/.test(username)){
message.textContent='اسم المستخدم غير صحيح';
return;
}

message.textContent='جارٍ تسجيل الدخول...';

const {data,error}=await supabase.auth.signInWithPassword({
email:makeEmail(username),
password:password
});

if(error){
message.textContent='اسم المستخدم أو كلمة المرور غير صحيحة';
return;
}

message.textContent='';
showDashboard(data.user);
};

document.getElementById('logoutBtn').onclick =
async function(){

await supabase.auth.signOut();

dashboard.classList.add('hidden');
login.classList.remove('hidden');

document.getElementById('password').value='';
message.textContent='تم تسجيل الخروج';
};

async function checkSession(){
const {data,error}=await supabase.auth.getSession();

if(!error && data.session){
showDashboard(data.session.user);
}
}

checkSession();

</script>
</body>
</html>
