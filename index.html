/* إدارة الطلاب */
async function getStudents(){
 const r=await db.from("user_roles").select("user_id").eq("role","student");
 if(r.error)throw r.error;

 const ids=(r.data||[]).map(x=>x.user_id);
 if(!ids.length)return [];

 const p=await db.from("profiles")
  .select("id,full_name,username,grade")
  .in("id",ids).order("full_name");

 if(p.error)throw p.error;
 return p.data||[];
}

/* تعديل اسم الطالب والصف الدراسي - النسخة المصححة */
async function editStudent(studentId){
 if(!requireTeacher())return;

 try{
  const {data:student,error}=await db.from("profiles")
   .select("id,full_name,grade")
   .eq("id",studentId)
   .single();

  if(error)throw error;

  const newName=prompt(
   "اكتب اسم الطالب بالكامل:",
   student.full_name||""
  );

  if(newName===null)return;

  const full_name=newName.trim();

  if(!full_name){
   alert("اسم الطالب لا يمكن أن يكون فارغًا.");
   return;
  }

  const grades=[
   "أولى إعدادي",
   "تانية إعدادي",
   "تالتة إعدادي",
   "أولى ثانوي",
   "تانية ثانوي",
   "تالتة ثانوي"
  ];

  const currentGrade=grades.indexOf(
   String(student.grade||"").trim()
  );

  const gradeChoice=prompt(
   "اكتب رقم الصف أو اسم الصف:\n"+
   "1- أولى إعدادي\n"+
   "2- تانية إعدادي\n"+
   "3- تالتة إعدادي\n"+
   "4- أولى ثانوي\n"+
   "5- تانية ثانوي\n"+
   "6- تالتة ثانوي",
   currentGrade>=0?String(currentGrade+1):""
  );

  if(gradeChoice===null)return;

  const entered=String(gradeChoice).trim();

  const normalized=entered
   .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
   .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));

  let selectedGrade="";

  if(/^[1-6]$/.test(normalized)){
   selectedGrade=grades[Number(normalized)-1];
  }else{
   selectedGrade=grades.find(
    g=>g===entered
   )||"";
  }

  if(!selectedGrade){
   alert("اختيار الصف غير صحيح.\nاكتب رقمًا من 1 إلى 6 أو اسم الصف كما هو مكتوب في القائمة.");
   return;
  }

  const {error:updateError}=await db.from("profiles")
   .update({
    full_name:full_name,
    grade:selectedGrade
   })
   .eq("id",studentId);

  if(updateError)throw updateError;

  alert("تم تحديث بيانات الطالب بنجاح.");

  await logActivity(
   "تعديل بيانات طالب",
   full_name+" - "+selectedGrade
  );

  await studentsPage();

 }catch(e){
  console.error(e);
  alert(
   "تعذر تعديل بيانات الطالب:\n"+
   (e.message||e)+
   "\n\nإذا استمرت المشكلة فقد تكون صلاحيات تعديل جدول profiles غير كافية."
  );
 }
}
window.editStudent=editStudent;

/* إنشاء طالب */
async function createStudent(){
 if(!requireTeacher())return;

 const full_name=$("studentName").value.trim();
 const username=$("studentUsername").value.trim().toLowerCase();
 const password=$("studentPassword").value;
 const grade=$("studentGrade").value;

 if(!full_name||!grade||!/^[a-z0-9._-]{3,32}$/.test(username)||password.length<8){
  alert("راجع الاسم واسم المستخدم والصف وكلمة المرور.");
  return;
 }

 const {data:{session}}=await db.auth.getSession();
 if(!session){alert("انتهت الجلسة، سجل الدخول مرة أخرى.");return}

 try{
  const res=await fetch(SUPABASE_URL+"/functions/v1/create-student",{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer "+session.access_token,
    "apikey":SUPABASE_KEY
   },
   body:JSON.stringify({full_name,username,password,grade})
  });

  const out=await res.json();
  if(!res.ok){alert(out.error||out.message||"فشل إنشاء الطالب");return}

  alert("تم إنشاء حساب الطالب.");
  await logActivity("إنشاء طالب",username);
  studentsPage();
 }catch(e){alert("تعذر الاتصال: "+e.message)}
}

/* حذف الطالب */
async function deleteStudent(studentId,studentName){
 if(!requireTeacher())return;

 const confirmed=confirm(
  "تحذير: هل أنت متأكد من حذف الطالب نهائيًا؟\n"+
  "الطالب: "+studentName+
  "\nسيتم حذف حسابه وسجلاته المرتبطة. لا يمكن التراجع عن الحذف."
 );

 if(!confirmed)return;

 try{
  const {data:{session}}=await db.auth.getSession();

  if(!session){
   alert("انتهت الجلسة. سجل الدخول مرة أخرى.");
   return;
  }

  const response=await fetch(
   SUPABASE_URL+"/functions/v1/delete-student",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "Authorization":"Bearer "+session.access_token,
     "apikey":SUPABASE_KEY
    },
    body:JSON.stringify({student_id:studentId})
   }
  );

  let result={};
  try{result=await response.json()}catch(e){}

  if(!response.ok){
   alert("فشل حذف الطالب: "+(result.error||result.message||"خطأ غير معروف"));
   return;
  }

  alert("تم حذف حساب الطالب بنجاح.");
  await studentsPage();

 }catch(e){
  alert("تعذر الاتصال بوظيفة الحذف: "+e.message);
 }
}
window.deleteStudent=deleteStudent;

async function saveAttendance(){
 if(!requireTeacher())return;
 const student_id=$("attStudent").value;
 const class_date=$("attDate").value;
 const status=$("attStatus").value;

 if(!student_id||!class_date){alert("اختر الطالب وتاريخ الحصة.");return}

 const student=await db.from("profiles").select("full_name").eq("id",student_id).single();
 if(student.error){alert(student.error.message);return}

 const r=await db.from("attendance").insert({
  student_id,student_name:student.data.full_name,class_date,status
 });
 if(r.error){alert(r.error.message);return}

 if(status==="absent"){
  const count=await db.from("attendance").select("id",{count:"exact",head:true})
   .eq("student_id",student_id).eq("status","absent");

  if(!count.error&&(count.count||0)>=3){
   const old=await db.from("absence_warnings").select("id").eq("student_id",student_id).limit(1);
   if(!old.error&&(!old.data||!old.data.length)){
    await db.from("absence_warnings").insert({
     student_id,absence_count:count.count,warning_number:1,
     warning_message:"تنبيه: وصل عدد مرات الغياب إلى 3 حصص."
    });
   }
  }
 }

 alert("تم تسجيل الحضور بنجاح.");
 await logActivity("تسجيل حضور",student.data.full_name+" - "+status);
 attendancePage();
}

/* عدد الأسئلة */
async function getQuestionCounts(exams){
 const counts={};
 const ids=(exams||[]).map(x=>x.id);
 if(!ids.length)return counts;

 const r=await db.from("questions").select("exam_id").in("exam_id",ids);
 if(r.error)throw r.error;
 (r.data||[]).forEach(q=>counts[q.exam_id]=(counts[q.exam_id]||0)+1);
 return counts;
}

 const r=await db.from("exams").select("*").order("created_at",{ascending:false});
 if(r.error){setContent(errorBox(r.error));return}

 const exams=r.data||[];
 let counts={};
 try{counts=await getQuestionCounts(exams)}catch(e){setContent(errorBox(e));return}

 setContent(`
  <h2>إنشاء امتحان</h2>
  <input id="examTitle" placeholder="اسم الامتحان">
  <select id="examSubject"><option value="history">التاريخ</option><option value="geography">الجغرافيا</option></select>
  <input id="examGrade" placeholder="الصف" value="${esc(profile?.grade||"")}">
  <label>مدة الامتحان بالدقائق</label>
  <input id="examDuration" type="number" min="1" max="300" value="30">
  <label>ظهور النتيجة</label>
  <select id="resultVisibility">
   <option value="manual">بعد سماح المدرس</option>
   <option value="immediate">فور التسليم</option>
   <option value="scheduled">في موعد محدد</option>
  </select>
  <label>موعد ظهور النتيجة</label>
  <input id="resultReleaseAt" type="datetime-local">
  <button onclick="addExam()">إنشاء الامتحان</button>
  <hr><h2>إضافة سؤال</h2>
  <select id="examSelect">
   ${exams.map(x=>`<option value="${x.id}">${esc(x.title)} — ${counts[x.id]||0} سؤال</option>`).join("")}
  </select>
  <textarea id="qText" placeholder="السؤال"></textarea>
  <label>نوع السؤال</label>
  <select id="qType" onchange="toggleQuestionFields()">
   <option value="mcq">اختيار من متعدد</option>
   <option value="true_false">صح أو خطأ</option>
   <option value="essay">مقالي</option>
  </select>
  <label>درجة السؤال</label>
  <input id="qMarks" type="number" min="0.5" step="0.5" value="1">
  <div id="objectiveFields">
   <input id="o0" placeholder="الاختيار الأول">
   <input id="o1" placeholder="الاختيار الثاني">
   <input id="o2" placeholder="الاختيار الثالث">
   <input id="o3" placeholder="الاختيار الرابع">
   <select id="correct">
    <option value="0">الأول</option><option value="1">الثاني</option>
    <option value="2">الثالث</option><option value="3">الرابع</option>
   </select>
  </div>
  <textarea id="modelAnswer" placeholder="الإجابة النموذجية / ملاحظات التصحيح"></textarea>
  <button onclick="addQuestion()">إضافة السؤال</button>
  <hr><h2>الامتحانات</h2>
  ${exams.map(x=>`
   <div class="item">
    <b>${esc(x.title)}</b><br>عدد الأسئلة: ${counts[x.id]||0} سؤال
    <br>${x.is_active?"نشط":"غير نشط"} — ${esc(x.grade||"")}
   </div>
  `).join("")||"<p>لا توجد امتحانات.</p>"}
 `);
}

async function addExam(){
 if(!requireTeacher())return;
 const title=$("examTitle").value.trim(),grade=$("examGrade").value.trim();
 if(!title||!grade){alert("اكتب اسم الامتحان والصف.");return}

 const r=await db.from("exams").insert({
  title,subject:$("examSubject").value,grade,
  duration_minutes:Math.max(1,Math.min(300,Number($("examDuration").value)||30)),
  result_visibility:$("resultVisibility").value,
  result_release_at:$("resultReleaseAt").value?new Date($("resultReleaseAt").value).toISOString():null,
  is_active:true
 });
 if(r.error){alert(r.error.message);return}
 await logActivity("إنشاء امتحان",title);
 alert("تم إنشاء الامتحان.");
 examsPage();
}

function toggleQuestionFields(){
 const t=$("qType")?.value,box=$("objectiveFields");
 if(box)box.classList.toggle("hidden",t==="essay");
 if(t==="true_false"){
  $("o0").value="صح";$("o1").value="خطأ";$("o2").value="";$("o3").value="";
 }
}

async function addQuestion(){
 if(!requireTeacher())return;
 const exam_id=Number($("examSelect").value);
 const question_text=$("qText").value.trim();
 const type=$("qType").value;
 const options=type==="essay"?[]:[$("o0").value,$("o1").value,$("o2").value,$("o3").value].filter(x=>x.trim());
 const marks=Number($("qMarks").value)||1;

 if(!exam_id||!question_text||marks<=0||(type!=="essay"&&options.length<2)){
  alert("أكمل السؤال والاختيارات والدرجة.");return;
 }

 const r=await db.from("questions").insert({
  exam_id,question_text,options,question_type:type,marks,
  correct_answer:type==="essay"?null:$("correct").value,
  model_answer:$("modelAnswer").value.trim()||null
 });
 if(r.error){alert(r.error.message);return}

 alert("تمت إضافة السؤال.");
 await logActivity("إضافة سؤال",question_text);
 examsPage();
}

/* امتحانات الطالب */
async function studentExamsPage(){
 if(!requireStudent())return;

 const studentGrade=String(profile?.grade||"").trim();

 if(!studentGrade){
  setContent(`
   <h2>الامتحانات المتاحة</h2>
   <div class="msg error">
    لم يتم تسجيل صفك الدراسي في حسابك.
    برجاء التواصل مع المدرس لتحديث بياناتك.
   </div>
  `);
  return;
 }

 const r=await db.from("exams")
  .select("*")
  .eq("is_active",true)
  .eq("grade",studentGrade)
  .order("created_at",{ascending:false});

 if(r.error){setContent(errorBox(r.error));return}

 const exams=r.data||[];

 let counts={},visibleResults={};

 try{
  counts=await getQuestionCounts(exams);

  const results=await db.from("exam_results")
   .select("exam_id,score_points,total_points")
   .eq("student_id",user.id)
   .eq("is_visible",true);

  if(results.error)throw results.error;

  (results.data||[]).forEach(x=>{
   visibleResults[x.exam_id]=x;
  });

 }catch(e){
  setContent(errorBox(e));
  return;
 }

 setContent(`
  <h2>الامتحانات المتاحة لصفك</h2>

  ${exams.map(x=>{
   const result=visibleResults[x.id];

   return `<div class="item">
    <b>${esc(x.title)}</b>
    <br>عدد الأسئلة: ${counts[x.id]||0} سؤال

    ${result?`
     <br><span class="msg">
      درجتك: ${esc(result.score_points)} من ${esc(result.total_points)}
     </span>`:""}

    <br><span class="small">
     المدة: ${esc(x.duration_minutes||30)} دقيقة
    </span>

    <br>
    <button onclick="startExam(${Number(x.id)})"
     ${!counts[x.id]?"disabled":""}>
     ${counts[x.id]?"ابدأ الامتحان":"لا توجد أسئلة"}
    </button>
   </div>`;
  }).join("")||"<p>لا توجد امتحانات متاحة لصفك حاليًا.</p>"}
 `);
}

async function startExam(id){
 if(!requireStudent())return;

 const r=await db.from("questions")
  .select("id,question_text,options,question_type,marks")
  .eq("exam_id",id);

 if(r.error){setContent(errorBox(r.error));return}

 const qs=r.data||[];
 if(!qs.length){alert("لا توجد أسئلة لهذا الامتحان.");return}

 if(qs.some(q=>(q.question_type||"mcq")==="essay")){
  setContent(errorBox("هذا الامتحان يحتوي على سؤال مقالي ويحتاج تصحيحًا منفصلًا."));
  return;
 }

 setContent(`
  <h2>الامتحان</h2>
  <div class="item">الوقت المتاح: <b id="examClock">--:--</b></div>
  <form id="examForm">
   ${qs.map((q,i)=>`
    <div class="item">
     <b>${i+1}. ${esc(q.question_text)}</b>
     <br><span class="small">الدرجة: ${esc(q.marks||1)}</span>
     ${(Array.isArray(q.options)?q.options:[]).map((o,j)=>`
      <label><input style="width:auto" type="radio" name="q${q.id}" value="${j}" required> ${esc(o)}</label>
     `).join("")}
    </div>
   `).join("")}
   <button type="submit">تسليم الامتحان</button>
  </form>
 `);

 const examMeta=await db.from("exams").select("duration_minutes").eq("id",id).single();
 let remaining=Math.max(1,Number(examMeta.data?.duration_minutes)||30)*60;
 let submitted=false;
 const clock=$("examClock");

 const tick=()=>{
  if(!clock||submitted)return;
  const m=Math.floor(remaining/60),ss=remaining%60;
  clock.textContent=String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");
  if(remaining<=0){$("examForm").requestSubmit();return}
  remaining--;
 };

 tick();
 const timer=setInterval(tick,1000);

 $("examForm").onsubmit=async e=>{
  e.preventDefault();
  if(submitted)return;
  submitted=true;
  clearInterval(timer);

  const answers={};
  qs.forEach(q=>answers[q.id]=new FormData(e.target).get("q"+q.id));

  const result=await db.rpc("submit_exam",{p_exam_id:id,p_answers:answers});
  if(result.error){
   alert(result.error.message);
   submitted=false;
   return;
  }

  alert("تم تسليم الامتحان بنجاح. ستظهر الدرجة بعد سماح المدرس.");
  await logActivity("تسليم امتحان",String(id));
  studentExamsPage();
 };
}

async function setResultVisibility(resultId,visible){
 if(!requireTeacher())return;

 const numericId=Number(resultId);

 if(!Number.isSafeInteger(numericId)||numericId<=0){
  alert("رقم النتيجة غير صحيح.");
  return;
 }

 const r=await db.rpc("set_exam_result_visibility",{
  p_result_id:numericId,
  p_visible:Boolean(visible)
 });

 if(r.error){
  alert("تعذر تغيير ظهور النتيجة: "+r.error.message);
  return;
 }

 alert(visible?"تم إظهار الدرجة للطالب":"تم إخفاء الدرجة عن الطالب");

 await logActivity(
  visible?"إظهار نتيجة امتحان":"إخفاء نتيجة امتحان",
  String(numericId)
 );

 await resultsPage();
}
window.setResultVisibility=setResultVisibility;

async function saveManualGrade(){
 if(!requireTeacher())return;
 const grade=Number($("mgGrade").value),max_grade=Number($("mgMax").value);

 if(!$("mgTitle").value.trim()||!Number.isFinite(grade)||!Number.isFinite(max_grade)||
  max_grade<=0||grade<0||grade>max_grade||!$("mgStudent").value){
  alert("راجع اسم التقييم والطالب والدرجة والنهاية الكبرى.");return;
 }

 const row={
  student_id:$("mgStudent").value,
  exam_title:$("mgTitle").value.trim(),
  subject:$("mgSubject").value.trim(),
  grade,max_grade,
  exam_date:$("mgDate").value||null,
  notes:$("mgNotes").value.trim(),
  created_by:user.id
 };

 const r=await db.from("manual_grades").insert(row);
 if(r.error){alert(r.error.message);return}
 alert("تم حفظ الدرجة.");
 await logActivity("إضافة درجة يدوية",row.exam_title);
 manualGradesPage();
}

  .order("created_at",{ascending:false}).limit(200);
 if(r.error){setContent(errorBox(r.error));return}

 setContent("<h2>سجل نشاط المنصة</h2>"+
  ((r.data||[]).map(x=>`
   <div class="item">
    <b>النشاط:</b> ${esc(x.activity)}
    <br><b>التفاصيل:</b> ${esc(x.details||"")}
    <br><b>المستخدم:</b> ${esc(x.user_id)}
    <br><span class="small">${esc(x.created_at)}</span>
   </div>
  `).join("")||"<p>لا توجد أنشطة مسجلة.</p>")
 );
}

/* إعدادات الحساب */
async function settingsPage(){
 setContent(`
  <h2>إعدادات الحساب</h2>
  <label>الاسم بالكامل</label>
  <input id="settingsName" value="${esc(profile?.full_name||"")}">
  <label>اسم المستخدم</label>
  <input id="settingsUsername" value="${esc(profile?.username||"")}" readonly>
  <p class="small">تغيير اسم المستخدم يحتاج تحديث بيانات تسجيل الدخول أيضًا.</p>
  <button onclick="saveProfile()">حفظ الاسم</button>
  <hr><h2>تغيير كلمة المرور</h2>
  <input id="newPassword" type="password" placeholder="كلمة المرور الجديدة">
  <input id="confirmPassword" type="password" placeholder="تأكيد كلمة المرور">
  <button onclick="changeOwnPassword()">تغيير كلمة المرور</button>
 `);
}

async function saveProfile(){
 const full_name=$("settingsName").value.trim();
 if(!full_name){alert("اكتب الاسم.");return}

 const r=await db.from("profiles").update({full_name}).eq("id",user.id);
 if(r.error){alert(r.error.message);return}

 profile={...profile,full_name};
 $("welcome").textContent="أهلاً بك "+full_name;
 alert("تم تحديث الاسم.");
 await logActivity("تعديل الاسم",full_name);
}

async function changeOwnPassword(){
 const p=$("newPassword").value,c=$("confirmPassword").value;
 if(p.length<8){alert("كلمة المرور يجب أن تكون 8 أحرف على الأقل.");return}
 if(p!==c){alert("كلمتا المرور غير متطابقتين.");return}

 const r=await db.auth.updateUser({password:p});
 if(r.error){alert(r.error.message);return}

 alert("تم تغيير كلمة المرور بنجاح.");
 $("newPassword").value="";
 $("confirmPassword").value="";
 await logActivity("تغيير كلمة المرور");
}

/* تسجيل الخروج واستعادة الجلسة */
async function logout(){
 await logActivity("تسجيل الخروج");
 await db.auth.signOut();
 location.reload();
}

if(db){
 db.auth.getSession().then(({data,error})=>{
  if(!error&&data.session)start(data.session.user);
 }).catch(error=>{
  console.error(error);
  message("loginMsg","تعذر استعادة الجلسة. يمكنك تسجيل الدخول من جديد.",true);
 });
}
