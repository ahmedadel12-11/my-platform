
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المنصة التعليمية المتكاملة</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 100%; max-width: 600px; box-sizing: border-box; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        .btn { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 5px; font-weight: bold; }
        .btn:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-success { background: #28a745; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        th { background: #007bff; color: white; }
        .warning { color: red; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="box">
    
    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen">
        <h2 style="text-align: center;">تسجيل الدخول للمنصة</h2>
        <input type="text" id="username" placeholder="اسم المستخدم (اكتب teacher للمدير)">
        <input type="password" id="password" placeholder="كلمة السر (اكتب 9999 للمدير)">
        <button class="btn" onclick="attemptLogin()">دخول المنصة</button>
    </div>

    <!-- لوحة تحكم المدير -->
    <div id="adminScreen" class="hidden">
        <h2>🛠️ لوحة تحكم المدير</h2>
        <button class="btn btn-danger" onclick="logout()" style="width: auto; padding: 6px 15px; margin-bottom: 10px;">تسجيل الخروج</button>
        
        <div style="background: #f9f9f9; padding: 12px; border-radius: 5px; margin-bottom: 15px;">
            <h4 style="margin: 0 0 8px 0;">إضافة طالب جديد:</h4>
            <input type="text" id="newStudentName" placeholder="اسم الطالب الثلاثي">
            <button class="btn btn-success" onclick="addStudent()">حفظ الطالب في المنصة</button>
        </div>

        <h4 style="margin-bottom: 5px;">سجل الطلاب والمتابعة والغياب:</h4>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>الطالب</th>
                        <th>الغياب</th>
                        <th>كويز</th>
                        <th>امتحان</th>
                        <th>التقدير</th>
                        <th>حذف</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- لوحة الطالب -->
    <div id="studentScreen" class="hidden">
        <h2 id="studentWelcome">مرحباً بك</h2>
        <button class="btn btn-danger" onclick="logout()" style="width: auto; padding: 6px 15px;">تسجيل الخروج</button>
        
        <div style="background: #f9f9f9; padding: 15px; border-radius: 5px; margin-top: 15px;">
            <p><strong>عدد غياباتك:</strong> <span id="stdAbsences">0</span> <span id="stdWarning" class="warning"></span></p>
            <p><strong>درجة الكويز:</strong> <span id="stdQuiz">0</span></p>
            <p><strong>درجة الامتحان:</strong> <span id="stdExam">0</span></p>
            <p><strong>التقدير العام:</strong> <span id="stdGrade" style="color:#007bff; font-weight:bold;">جيد</span></p>
        </div>
    </div>

</div>

<script>
    // إنشاء بيانات أولية لو مش موجودة
    if (!localStorage.getItem("studentsList")) {
        localStorage.setItem("studentsList", JSON.stringify([
            { name: "أحمد علي", absences: 1, quiz: 85, exam: 90, grade: "ممتاز" },
            { name: "محمد محمود", absences: 3, quiz: 60, exam: 65, grade: "مقبول" }
        ]));
    }

    window.onload = function() {
        let role = localStorage.getItem("userRole");
        let user = localStorage.getItem("currentUser");
        if (role === "admin") {
            showAdminPanel();
        } else if (role === "student" && user) {
            showStudentPanel(user);
        }
    };

    function attemptLogin() {
        let u = document.getElementById("username").value.trim();
        let p = document.getElementById("password").value.trim();

        if (!u || !p) {
            alert("من فضلك اكتب اسم المستخدم وكلمة السر!");
            return;
        }

        // دخول المدير
        if (u === "teacher" && p === "9999") {
            localStorage.setItem("userRole", "admin");
            localStorage.setItem("currentUser", "المدير");
            showAdminPanel();
            return;
        }

        // دخول الطالب (يجب أن يكون مسجل بواسطة المدير)
        let students = JSON.parse(localStorage.getItem("studentsList")) || [];
        let found = students.find(s => s.name === u);

        if (found) {
            localStorage.setItem("userRole", "student");
            localStorage.setItem("currentUser", u);
            showStudentPanel(u);
        } else {
            alert("خطأ في البيانات أو أن اسم الطالب غير مسجل في المنصة!");
        }
    }

    function showAdminPanel() {
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("studentScreen").classList.add("hidden");
        document.getElementById("adminScreen").classList.remove("hidden");
        loadTable();
    }

    function showStudentPanel(name) {
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("adminScreen").classList.add("hidden");
        document.getElementById("studentScreen").classList.remove("hidden");
        
        document.getElementById("studentWelcome").innerText = "أهلاً بك يا بطل: " + name;
        
        let students = JSON.parse(localStorage.getItem("studentsList")) || [];
        let s = students.find(item => item.name === name);
        if (s) {
            document.getElementById("stdAbsences").innerText = s.absences;
            if (s.absences >= 3) {
                document.getElementById("stdWarning").innerText = " (⚠️ تنبيه: لقد تجاوزت 3 غيبات!)";
            } else {
                document.getElementById("stdWarning").innerText = "";
            }
            document.getElementById("stdQuiz").innerText = s.quiz;
            document.getElementById("stdExam").innerText = s.exam;
            document.getElementById("stdGrade").innerText = s.grade;
        }
    }

    function loadTable() {
        let students = JSON.parse(localStorage.getItem("studentsList")) || [];
        let tbody = document.getElementById("studentsTableBody");
        tbody.innerHTML = "";

        students.forEach((s, index) => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${s.name}</td>
                <td>
                    <input type="number" value="${s.absences}" min="0" style="width:45px; text-align:center;" onchange="updateData(${index}, 'absences', this.value)">
                    ${s.absences >= 3 ? '<br><span class="warning" style="font-size:10px;">⚠️ إنذار غياب</span>' : ''}
                </td>
                <td><input type="number" value="${s.quiz}" style="width:50px; text-align:center;" onchange="updateData(${index}, 'quiz', this.value)"></td>
                <td><input type="number" value="${s.exam}" style="width:50px; text-align:center;" onchange="updateData(${index}, 'exam', this.value)"></td>
                <td>
                    <select onchange="updateData(${index}, 'grade', this.value)" style="padding:2px;">
                        <option value="ممتاز" ${s.grade === 'ممتاز' ? 'selected' : ''}>ممتاز</option>
                        <option value="جيد جداً" ${s.grade === 'جيد جداً' ? 'selected' : ''}>جيد جداً</option>
                        <option value="جيد" ${s.grade === 'جيد' ? 'selected' : ''}>جيد</option>
                        <option value="مقبول" ${s.grade === 'مقبول' ? 'selected' : ''}>مقبول</option>
                        <option value="ضعيف" ${s.grade === 'ضعيف' ? 'selected' : ''}>ضعيف</option>
                    </select>
                </td>
                <td><button class="btn btn-danger" style="padding:2px 6px; font-size:11px;" onclick="deleteStudent(${index})">حذف</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function addStudent() {
        let input = document.getElementById("newStudentName");
        let name = input.value.trim();
        if (!name) {
            alert("اكتب اسم الطالب من فضلك!");
            return;
        }
        let students = JSON.parse(localStorage.getItem("studentsList")) || [];
        students.push({ name: name, absences: 0, quiz: 0, exam: 0, grade: "جيد" });
        localStorage.setItem("studentsList", JSON.stringify(students));
        input.value = "";
        loadTable();
    }

    function updateData(index, field, value) {
        let students = JSON.parse(localStorage.getItem("studentsList")) || [];
        if (field === 'absences' || field === 'quiz' || field === 'exam') {
            students[index][field] = Number(value);
        } else {
            students[index][field] = value;
        }
        localStorage.setItem("studentsList", JSON.stringify(students));
        loadTable();
    }

    function deleteStudent(index) {
        if (confirm("هل أنت متأكد من حذف هذا الطالب؟")) {
            let students = JSON.parse(localStorage.getItem("studentsList")) || [];
            students.splice(index, 1);
            localStorage.setItem("studentsList", JSON.stringify(students));
            loadTable();
        }
    }

    function logout() {
        localStorage.removeItem("userRole");
        localStorage.removeItem("currentUser");
        location.reload();
    }
</script>

</body>
</html>
