

    

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة مستر أحمد عادل التعليمية</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:linear-gradient(135deg,#10131c,#202b3d);
color:#fff;
min-height:100vh;
padding:25px;
display:flex;
justify-content:center;
align-items:center
}
.container{
width:100%;
max-width:460px;
background:#1b2030;
padding:30px;
border-radius:20px;
border:1px solid #424a5d;
box-shadow:0 15px 50px #0007
}
h1{text-align:center;color:#f6a623}
.subtitle{text-align:center;color:#c4cad5;line-height:1.8}
input{
width:100%;
padding:15px;
margin:10px 0;
border:1px solid #41495e;
border-radius:10px;
background:#111725;
color:white;
font-size:16px
}
button{
width:100%;
padding:15px;
margin-top:12px;
border:0;
border-radius:10px;
background:#f6a623;
color:#171717;
font-weight:bold;
font-size:16px;
cursor:pointer
}
.secondary{background:#354159;color:white}
.hidden{display:none!important}
#message{text-align:center;color:#ffc35c;line-height:1.8}
.card{
background:#283247;
padding:20px;
border-radius:14px;
margin:15px 0;
border-right:4px solid #f6a623
}
</style>
</head>
<body>

<div class="container">

<section id="login">
<h1>مستر أحمد عادل</h1>
<p class="subtitle">منصتك التعليمية للتاريخ والجغرافيا</p>

<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">تسجيل الدخول</button>
<button id="signupBtn" class="secondary">إنشاء حساب طالب جديد</button>

<p id="message"></p>
</section>

<section id="dashboard" class="hidden">
<h1>أهلاً بك في المنصة</h1>
<p class="subtitle" id="studentEmail"></p>

<div class="card">
<h3>📚 التاريخ</h3>
<p>قسم التاريخ والمراجعات التعليمية</p>
</div>

<div class="card">
<h3>🌍 الجغرافيا</h3>
<p>قسم الجغرافيا والمراجعات التعليمية</p>
</div>

<div class="card">
<h3>📝 الامتحانات</h3>
<p>الامتحانات والنتائج ستظهر هنا بعد إعدادها.</p>
</div>

<button id="logoutBtn">تسجيل الخروج</button>
</section>

</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL =
'https://vpppdppyuvpfawtvmyph.supabase.co';

const SUPABASE_KEY =
'sb_publishable_S_-TuxVqSsmLQmEMtL6IAA_oUXtEiM3';

const supabase = createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const login = document.getElementById('login');
const dashboard = document.getElementById('dashboard');
const message = document.getElementById('message');

function showDashboard(user){
login.classList.add('hidden');
dashboard.classList.remove('hidden');
document.getElementById('studentEmail').textContent =
'البريد الإلكتروني: '+user.email;
}

document.getElementById('signupBtn').onclick =
async function(){

const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;

if(!email || password.length<6){
message.textContent='أدخل البريد الإلكتروني وكلمة مرور لا تقل عن 6 أحرف';
return;
}

message.textContent='جارٍ إنشاء الحساب...';

const {data,error}=await supabase.auth.signUp({
email:email,
password:password
});

if(error){
message.textContent='تعذر إنشاء الحساب: '+error.message;
return;
}

message.textContent=data.session
?'تم إنشاء الحساب بنجاح'
:'تم إنشاء الحساب. راجع بريدك الإلكتروني لتأكيده إذا طُلب منك ذلك.';

if(data.session) showDashboard(data.user);
};

document.getElementById('loginBtn').onclick =
async function(){

const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;

if(!email || !password){
message.textContent='اكتب البريد الإلكتروني وكلمة المرور';
return;
}

message.textContent='جارٍ تسجيل الدخول...';

const {data,error}=await supabase.auth.signInWithPassword({
email:email,
password:password
});

if(error){
message.textContent='بيانات الدخول غير صحيحة أو حدث خطأ: '+error.message;
return;
}

showDashboard(data.user);
};

document.getElementById('logoutBtn').onclick =
async function(){

await supabase.auth.signOut();
dashboard.classList.add('hidden');
login.classList.remove('hidden');
message.textContent='تم تسجيل الخروج';
};

async function checkSession(){
const {data,error}=await supabase.auth.getSession();
if(!error && data.session){
showDashboard(data.session.user);
}
}

checkSession();

</script>
</body>
</html>
