function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

/* إدارة الصفوف */

async function getGrades(){
 const r=await db.from("school_grades")
  .select("id,name")
  .order("name",{ascending:true});

 if(r.error)throw r.error;
 return r.data||[];
}

function gradeOptions(grades,selected="",includeAll=false){
 let html=includeAll?'<option value="">كل الصفوف</option>':'<option value="">اختر الصف</option>';

 html+=(grades||[]).map(g=>
  `<option value="${esc(g.name)}" ${g.name===selected?"selected":""}>${esc(g.name)}</option>`
 ).join("");

 return html;
}

async function gradesPage(){
 if(!requireTeacher())return;

 setContent(`
  <h2>إدارة الصفوف الدراسية</h2>
  <p class="small">أضف الصفوف أو احذفها أو غيّر أسماءها.</p>
  <label>اسم الصف الجديد</label>
  <input id="newGradeName" placeholder="مثال: رابعة ابتدائي">
  <button onclick="addGrade()">إضافة الصف</button>
  <hr>
  <h3>الصفوف الموجودة</h3>
  <div id="gradesList">جار تحميل الصفوف...</div>
 `);

 try{
  const grades=await getGrades();

  $("gradesList").innerHTML=grades.map(g=>`
   <div class="item">
    <b>${esc(g.name)}</b><br>
    <button class="secondary" onclick="renameGrade(${Number(g.id)},'${esc(g.name)}')">تعديل اسم الصف</button>
    <button class="danger" onclick="deleteGrade(${Number(g.id)},'${esc(g.name)}')">حذف الصف</button>
   </div>
  `).join("")||"<p>لا توجد صفوف. أضف الصف الأول من الأعلى.</p>";

 }catch(e){
  $("gradesList").innerHTML=errorBox(e);
 }
}

async function addGrade(){
 if(!requireTeacher())return;

 const name=$("newGradeName").value.trim();
 if(!name){alert("اكتب اسم الصف.");return}

 try{
  const r=await db.from("school_grades").insert({name});
  if(r.error)throw r.error;

  await logActivity("إضافة صف دراسي",name);
  alert("تمت إضافة الصف بنجاح.");
  await gradesPage();
 }catch(e){
  alert("تعذر إضافة الصف: "+(e.message||e));
 }
}

async function gradeIsUsed(name){
 const tables=["profiles","lessons","exams","announcements"];

 for(const table of tables){
  const r=await db.from(table)
   .select("grade",{count:"exact",head:true})
   .eq("grade",name);

  if(r.error)throw r.error;
  if((r.count||0)>0)return table;
 }
 return null;
}

async function renameGrade(id,oldName){
 if(!requireTeacher())return;

 const newName=prompt("اكتب اسم الصف الجديد:",oldName);
 if(newName===null)return;

 const name=newName.trim();
 if(!name){alert("اسم الصف لا يمكن أن يكون فارغًا.");return}
 if(name===oldName)return;

 try{
  const usedIn=await gradeIsUsed(oldName);
  if(usedIn){
   alert("لا يمكن تغيير اسم الصف؛ لأنه مرتبط ببيانات موجودة.");
   return;
  }

  const r=await db.from("school_grades").update({name}).eq("id",id);
  if(r.error)throw r.error;

  await logActivity("تعديل اسم صف",oldName+" إلى "+name);
  alert("تم تعديل اسم الصف.");
  await gradesPage();
 }catch(e){
  alert("تعذر تعديل الصف: "+(e.message||e));
 }
}

async function deleteGrade(id,name){
 if(!requireTeacher())return;
 if(!confirm("هل أنت متأكد من حذف الصف: "+name+"؟"))return;

 try{
  const usedIn=await gradeIsUsed(name);
  if(usedIn){
   alert("لا يمكن حذف هذا الصف؛ لأنه مرتبط ببيانات موجودة.");
   return;
  }

  const r=await db.from("school_grades").delete().eq("id",id);
  if(r.error)throw r.error;

  await logActivity("حذف صف دراسي",name);
  alert("تم حذف الصف.");
  await gradesPage();
 }catch(e){
  alert("تعذر حذف الصف: "+(e.message||e));
 }
}

window.addGrade=addGrade;
window.renameGrade=renameGrade;
window.deleteGrade=deleteGrade;

async function login(){
 const btn=document.querySelector('button[onclick="login()"]');

 try{
  if(!db){
   message("loginMsg","تعذر تحميل نظام تسجيل الدخول.",true);
   return;
  }

  const u=$("username").value.trim().toLowerCase();
  const p=$("password").value;

  if(!/^[a-z0-9._-]{3,32}$/.test(u)||!p){
   message("loginMsg","اكتب اسم المستخدم وكلمة المرور بشكل صحيح",true);
   return;
  }

  btn.disabled=true;
  btn.textContent="جارٍ تسجيل الدخول...";
  message("loginMsg","جارٍ التحقق من البيانات...");

  const email=u==="mrahmedadel"?"boda@students.example.com":u+"@students.example.com";
  const {data,error}=await db.auth.signInWithPassword({email,password:p});

  if(error){
   message("loginMsg","تعذر تسجيل الدخول: "+error.message,true);
   return;
  }

  await start(data.user);

 }catch(e){
  message("loginMsg","حدث خطأ: "+(e?.message||e),true);
 }finally{
  if(btn){
   btn.disabled=false;
   btn.textContent="دخول المنصة";
  }
 }
}
window.login=login;

 if(r.error||!r.data){
  await db.auth.signOut();

  message("loginMsg","الحساب غير مفعل أو لا توجد صلاحية",true);
  return;
 }

 role=r.data.role;

 if(!["teacher","student"].includes(role)){
  await db.auth.signOut();
  user=null;
  return;
 }

 const p=await db.from("profiles")
  .select("*").eq("id",user.id).maybeSingle();

 if(p.error){
  alert("تعذر تحميل الملف الشخصي: "+p.error.message);
  return;
 }

 profile=p.data;

 $("login").classList.add("hidden");

 $("welcome").textContent="أهلاً بك "+(profile?.full_name||"في المنصة");

/* إدارة الطلاب */

async function getStudents(){
 const r=await db.from("user_roles").select("user_id").eq("role","student");
 if(r.error)throw r.error;

 const ids=(r.data||[]).map(x=>x.user_id);
 if(!ids.length)return [];

 const p=await db.from("profiles")
  .select("id,full_name,username,grade")
  .in("id",ids).order("full_name");

 if(p.error)throw p.error;
 return p.data||[];
}

async function studentsPage(){
 if(!requireTeacher())return;

 setContent(`
  <h2>إدارة الطلاب</h2>
  <input id="studentName" placeholder="اسم الطالب بالكامل">
  <input id="studentUsername" placeholder="اسم المستخدم بالإنجليزية">
  <input id="studentPassword" type="password" placeholder="كلمة المرور">
  <label>الصف الدراسي</label>
  <select id="studentGrade"><option value="">جار تحميل الصفوف...</option></select>
  <button id="createStudentBtn" onclick="createStudent()">إنشاء حساب طالب</button>
  <div id="studentList">جار تحميل الطلاب...</div>
 `);

 try{
  const [students,grades]=await Promise.all([getStudents(),getGrades()]);

  $("studentGrade").innerHTML=gradeOptions(grades);

  $("studentList").innerHTML=students.map(s=>`
   <div class="item">
    <b>${esc(s.full_name)}</b><br>
    اسم المستخدم: ${esc(s.username)}<br>
    الصف: ${esc(s.grade||"غير محدد")}<br>
    <button class="success" onclick="editStudent('${esc(s.id)}')">تعديل بيانات الطالب</button>
    <button class="danger" onclick="deleteStudent('${esc(s.id)}','${esc(s.full_name)}')">حذف الطالب نهائيًا</button>
   </div>
  `).join("")||"<p>لا يوجد طلاب.</p>";

 }catch(e){
  $("studentList").innerHTML=errorBox(e);
 }
}

async function editStudent(studentId){
 if(!requireTeacher())return;

 try{
  const [{data:student,error},grades]=await Promise.all([
   db.from("profiles").select("id,full_name,grade").eq("id",studentId).single(),
   getGrades()
  ]);

  if(error)throw error;

  const newName=prompt("اكتب اسم الطالب بالكامل:",student.full_name||"");
  if(newName===null)return;

  const full_name=newName.trim();
  if(!full_name){alert("اسم الطالب لا يمكن أن يكون فارغًا.");return}

  if(!grades.length){
   alert("لا توجد صفوف مسجلة. أضف صفًا أولًا.");
   return;
  }

  const currentIndex=grades.findIndex(g=>g.name===student.grade);
  const gradeList=grades.map((g,i)=>(i+1)+"- "+g.name).join("\n");

  const choice=prompt("اختر رقم الصف الجديد:\n"+gradeList,
   currentIndex>=0?String(currentIndex+1):"");

  if(choice===null)return;

  const normalized=String(choice).trim()
   .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
   .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));

  const index=Number(normalized)-1;

  if(!Number.isInteger(index)||index<0||index>=grades.length){
   alert("رقم الصف غير صحيح.");
   return;
  }

  const selectedGrade=grades[index].name;

  const {error:updateError}=await db.from("profiles")
   .update({full_name,grade:selectedGrade})
   .eq("id",studentId);

  if(updateError)throw updateError;

  const verify=await db.from("profiles")
   .select("grade").eq("id",studentId).single();

  if(verify.error)throw verify.error;
  if(String(verify.data.grade||"").trim()!==selectedGrade){
   throw new Error("لم يتم تأكيد حفظ الصف الدراسي.");
  }

  alert("تم تحديث بيانات الطالب وحفظ الصف: "+selectedGrade);
  await logActivity("تعديل بيانات طالب",full_name+" - "+selectedGrade);
  await studentsPage();

 }catch(e){
  console.error(e);
  alert("تعذر تعديل بيانات الطالب: "+(e.message||e));
 }
}
window.editStudent=editStudent;

/* إنشاء طالب */

async function createStudent(){
 if(!requireTeacher())return;

 const btn=$("createStudentBtn");
 const full_name=$("studentName").value.trim();
 const username=$("studentUsername").value.trim().toLowerCase();
 const password=$("studentPassword").value;
 const gradeSelect=$("studentGrade");
 const grade=gradeSelect.value;
 const gradeName=gradeSelect.options[gradeSelect.selectedIndex]?.textContent?.trim();

 if(!full_name||!grade||!gradeName||
    !/^[a-z0-9._-]{3,32}$/.test(username)||password.length<8){
  alert("راجع الاسم واسم المستخدم والصف وكلمة المرور. كلمة المرور لا تقل عن 8 أحرف.");
  return;
 }

 try{
  btn.disabled=true;
  btn.textContent="جارٍ إنشاء الطالب...";

  const {data:{session},error:sessionError}=await db.auth.getSession();
  if(sessionError)throw sessionError;
  if(!session)throw new Error("انتهت الجلسة. سجل الدخول مرة أخرى.");

  const response=await fetch(
   SUPABASE_URL+"/functions/v1/create-student",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "Authorization":"Bearer "+session.access_token,
     "apikey":SUPABASE_KEY
    },
    body:JSON.stringify({
     full_name:full_name,
     username:username,
     password:password,
     grade:gradeName
    })
   }
  );

  let result={};
  try{
   result=await response.json();
  }catch(e){
   throw new Error("استجابة وظيفة إنشاء الطالب غير مفهومة.");
  }

  if(!response.ok||result.success===false){
   throw new Error(result.error||result.message||"فشل إنشاء الطالب.");
  }

  let studentId=result.student?.id||result.student_id||null;

  if(!studentId){
   const findStudent=await db.from("profiles")
    .select("id")
    .eq("username",username)
    .maybeSingle();

   if(findStudent.error)throw findStudent.error;
   studentId=findStudent.data?.id||null;
  }

  if(!studentId){
   throw new Error("تم تنفيذ طلب إنشاء الحساب، لكن لم يتم العثور على سجل الطالب في profiles.");
  }

  const saveGrade=await db.from("profiles")
   .update({full_name:full_name,grade:gradeName})
   .eq("id",studentId)
   .select("id,full_name,username,grade")
   .single();

  if(saveGrade.error){
   throw new Error("تم إنشاء الحساب لكن تعذر حفظ الصف في جدول profiles: "+saveGrade.error.message);
  }

  if(String(saveGrade.data.grade||"").trim()!==gradeName){
   throw new Error("لم يتم تأكيد حفظ الصف الدراسي.");
  }

  alert("تم إنشاء حساب الطالب وحفظ الصف الدراسي بنجاح: "+gradeName);

  await logActivity("إنشاء طالب",username+" - "+gradeName);

  $("studentName").value="";
  $("studentUsername").value="";
  $("studentPassword").value="";
  $("studentGrade").value="";

  await studentsPage();

 }catch(e){
  console.error(e);
  alert("تعذر إتمام إنشاء الطالب:\n"+(e.message||e));
 }finally{
  if(btn){
   btn.disabled=false;
   btn.textContent="إنشاء حساب طالب";
  }
 }
}
window.createStudent=createStudent;

/* حذف الطالب */

async function deleteStudent(studentId,studentName){
 if(!requireTeacher())return;

 const confirmed=confirm(
  "تحذير: هل أنت متأكد من حذف الطالب نهائيًا؟\n"+
  "الطالب: "+studentName+
  "\nسيتم حذف حسابه وسجلاته المرتبطة."
 );

 if(!confirmed)return;

 try{
  const {data:{session}}=await db.auth.getSession();
  if(!session){alert("انتهت الجلسة. سجل الدخول مرة أخرى.");return}

  const response=await fetch(SUPABASE_URL+"/functions/v1/delete-student",{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer "+session.access_token,
    "apikey":SUPABASE_KEY
   },
   body:JSON.stringify({student_id:studentId})
  });

  let result={};
  try{result=await response.json()}catch(e){}

  if(!response.ok){
   alert("فشل حذف الطالب: "+(result.error||result.message||"خطأ غير معروف"));
   return;
  }

  alert("تم حذف حساب الطالب بنجاح.");
  await studentsPage();

 }catch(e){
  alert("تعذر الاتصال بوظيفة الحذف: "+e.message);
 }
}
window.deleteStudent=deleteStudent;

 setContent(`

   <select id="subject">
    <option value="history">التاريخ</option>
    <option value="geography">الجغرافيا</option>

async function saveAttendance(){

  const count=await db.from("attendance")
   .select("id",{count:"exact",head:true})

    .select("id").eq("student_id",student_id).limit(1);

   if(!old.error&&(!old.data||!old.data.length)){

     absence_count:count.count,
     warning_number:1,
     warning_message:"تنبيه: وصل عدد مرات الغياب إلى 3 حصص."
    });
   }
  }
 }

 alert("تم تسجيل الحضور بنجاح.");
 await logActivity("تسجيل حضور",student.data.full_name+" - "+status);
 attendancePage();
}

async function getQuestionCounts(exams){
 const counts={};
 const ids=(exams||[]).map(x=>x.id);
 if(!ids.length)return counts;

 const r=await db.from("questions").select("exam_id").in("exam_id",ids);
 if(r.error)throw r.error;

 (r.data||[]).forEach(q=>counts[q.exam_id]=(counts[q.exam_id]||0)+1);
 return counts;
}

async function startExam(id){
 if(!requireStudent())return;

 const meta=await db.from("exams")
  .select("*")
  .eq("id",id)
  .is("deleted_at",null)
  .single();

 if(meta.error){alert("الامتحان غير متاح.");return}

 const exam=meta.data;
 const studentGrade=String(profile?.grade||"").trim();

 if(!exam.is_active||String(exam.grade||"").trim()!==studentGrade){
  alert("هذا الامتحان غير متاح لحسابك.");
  return;
 }

 const now=new Date();

 if(exam.starts_at&&now<new Date(exam.starts_at)){
  alert("لم يبدأ موعد الامتحان بعد.");
  return;
 }

 if(exam.ends_at&&now>=new Date(exam.ends_at)){
  alert("انتهى موعد الامتحان.");
  return;
 }

 const r=await db.from("questions")
  .select("id,question_text,options,question_type,marks")
  .eq("exam_id",id);

 if(r.error){setContent(errorBox(r.error));return}

 const qs=r.data||[];
 if(!qs.length){alert("لا توجد أسئلة لهذا الامتحان.");return}

 if(qs.some(q=>(q.question_type||"mcq")==="essay")){
  setContent(errorBox("هذا الامتحان يحتوي على سؤال مقالي ويحتاج تصحيحًا منفصلًا."));
  return;
 }

 setContent(`
  <h2>${esc(exam.title)}</h2>
  <div class="item">الوقت المتبقي: <b id="examClock">--:--</b></div>
  <form id="examForm" novalidate>
   ${qs.map((q,i)=>`
    <div class="item">
     <b>${i+1}. ${esc(q.question_text)}</b><br>
     <span class="small">الدرجة: ${esc(q.marks||1)}</span>
     ${(Array.isArray(q.options)?q.options:[]).map((o,j)=>`
      <label>
       <input style="width:auto" type="radio" name="q${q.id}" value="${j}">
       ${esc(o)}
      </label>
     `).join("")}
    </div>
   `).join("")}
   <button type="submit">تسليم الامتحان</button>
  </form>
 `);

 const duration=Math.max(1,Number(exam.duration_minutes)||30)*60;
 const endSeconds=exam.ends_at?
  Math.floor((new Date(exam.ends_at).getTime()-Date.now())/1000):duration;

 let remaining=Math.max(1,Math.min(duration,endSeconds));
 let submitted=false;
 const clock=$("examClock");
 const form=$("examForm");

 const tick=()=>{
  if(!clock||submitted)return;

  const m=Math.floor(remaining/60);
  const s=remaining%60;
  clock.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");

  if(remaining<=0){
   form.requestSubmit();
   return;
  }

  remaining--;
 };

 tick();
 const timer=setInterval(tick,1000);

 form.onsubmit=async e=>{
  e.preventDefault();
  if(submitted)return;

  const answers={};
  const formData=new FormData(e.target);

  qs.forEach(q=>{
   answers[q.id]=formData.get("q"+q.id);
  });

  submitted=true;
  clearInterval(timer);

  const result=await db.rpc("submit_exam",{
   p_exam_id:id,
   p_answers:answers
  });

  if(result.error){
   submitted=false;
   alert("لم يتم تسليم الامتحان: "+result.error.message);
   studentExamsPage();
   return;
  }

  alert("تم تسليم الامتحان بنجاح. ستظهر الدرجة بعد سماح المدرس.");
  await logActivity("تسليم امتحان",exam.title);
  studentExamsPage();
 };
}

  <hr><h2>الدرجات اليدوية</h2>

   <div class="item">

async function setResultVisibility(resultId,visible){
 if(!requireTeacher())return;

 const numericId=Number(resultId);
 if(!Number.isSafeInteger(numericId)||numericId<=0){alert("رقم النتيجة غير صحيح.");return}

 const r=await db.rpc("set_exam_result_visibility",{
  p_result_id:numericId,p_visible:Boolean(visible)
 });

 if(r.error){alert("تعذر تغيير ظهور النتيجة: "+r.error.message);return}

 alert(visible?"تم إظهار الدرجة للطالب":"تم إخفاء الدرجة عن الطالب");
 await logActivity(visible?"إظهار نتيجة امتحان":"إخفاء نتيجة امتحان",String(numericId));
 await resultsPage();
}
window.setResultVisibility=setResultVisibility;

/* نتائج الطالب */

async function myResultsPage(){
 if(!requireStudent())return;

 const r=await db.from("exam_results")
  .select("id,exam_id,exam_title,score_points,total_points,submitted_at")
  .eq("student_id",user.id)
  .eq("is_visible",true)
  .order("submitted_at",{ascending:false});

 if(r.error){setContent(errorBox(r.error));return}

 setContent(`
  <h2>نتائجي</h2>
  <h3>نتائج الامتحانات</h3>
  ${(r.data||[]).map(x=>`
   <div class="item">
    <b>${esc(x.exam_title||"امتحان سابق")}</b>
    <br>الدرجة: ${esc(x.score_points??"—")} من ${esc(x.total_points??"—")}
    <br><span class="small">${esc(x.submitted_at||"")}</span>
   </div>
  `).join("")||"<p>لا توجد نتائج ظاهرة لك حاليًا.</p>"}
 `);
}

/* حضور الطالب وإنذاراته */

async function myAttendancePage(){
 if(!requireStudent())return;

 const [a,w]=await Promise.all([
  db.from("attendance").select("*").eq("student_id",user.id).order("class_date",{ascending:false}),
  db.from("absence_warnings").select("*").eq("student_id",user.id).order("warning_number")
 ]);

 if(a.error||w.error){setContent(errorBox(a.error||w.error));return}

 setContent(`
  <h2>سجل الحضور</h2>
  ${(a.data||[]).map(x=>`
   <div class="item">
    التاريخ: ${esc(x.class_date)}
    <br>الحالة: ${x.status==="absent"?"غائب":x.status==="present"?"حاضر":x.status==="excused"?"غائب بعذر":esc(x.status)}
   </div>
  `).join("")||"<p>لا توجد سجلات حضور.</p>"}
  <hr><h2>إنذارات الغياب</h2>
  ${(w.data||[]).map(x=>`<div class="item">${esc(x.warning_message)}</div>`).join("")||"<p>لا توجد إنذارات.</p>"}
 `);
}

/* الدرجات اليدوية */

async function manualGradesPage(){
 if(!requireTeacher())return;

 let students;
 try{students=await getStudents()}
 catch(e){setContent(errorBox(e));return}

 const r=await db.from("manual_grades")
  .select("id,student_id,exam_title,subject,grade,max_grade,exam_date,notes,created_at")
  .order("created_at",{ascending:false});

 if(r.error){setContent(errorBox(r.error));return}

 setContent(`
  <h2>إضافة درجة يدوية</h2>
  <label>الطالب</label>
  <select id="mgStudent">
   ${students.map(s=>`<option value="${s.id}">${esc(s.full_name)}</option>`).join("")}
  </select>
  <input id="mgTitle" placeholder="اسم الامتحان أو التقييم">
  <input id="mgSubject" placeholder="المادة">
  <input id="mgGrade" type="number" step="0.01" placeholder="الدرجة">
  <input id="mgMax" type="number" step="0.01" value="100" placeholder="النهاية الكبرى">
  <input id="mgDate" type="date">
  <textarea id="mgNotes" placeholder="ملاحظات"></textarea>
  <button onclick="saveManualGrade()">حفظ الدرجة</button>
  <hr><h2>الدرجات المسجلة</h2>
  ${(r.data||[]).map(x=>`
   <div class="item">
    الطالب: ${esc(students.find(s=>s.id===x.student_id)?.full_name||x.student_id)}
    <br>${esc(x.exam_title)} — ${esc(x.subject)}
    <br>الدرجة: ${esc(x.grade)} من ${esc(x.max_grade)}
    <br>${esc(x.exam_date||"")}<br>${esc(x.notes||"")}
   </div>
  `).join("")||"<p>لا توجد درجات.</p>"}
 `);
}

async function saveManualGrade(){
 if(!requireTeacher())return;

 const grade=Number($("mgGrade").value);
 const max_grade=Number($("mgMax").value);

 if(!$("mgTitle").value.trim()||!Number.isFinite(grade)||!Number.isFinite(max_grade)||
  max_grade<=0||grade<0||grade>max_grade||!$("mgStudent").value){
  alert("راجع اسم التقييم والطالب والدرجة والنهاية الكبرى.");
  return;
 }

 const row={
  student_id:$("mgStudent").value,
  exam_title:$("mgTitle").value.trim(),
  subject:$("mgSubject").value.trim(),
  grade,max_grade,
  exam_date:$("mgDate").value||null,
  notes:$("mgNotes").value.trim(),
  created_by:user.id
 };

 const r=await db.from("manual_grades").insert(row);
 if(r.error){alert(r.error.message);return}

 alert("تم حفظ الدرجة.");
 await logActivity("إضافة درجة يدوية",row.exam_title);
 manualGradesPage();
}

  .order("created_at",{ascending:false});

async function sendResetRequest(){
 if(!requireStudent())return;

 const r=await db.from("password_reset_requests").insert({
  student_id:user.id,username:profile?.username||"",status:"pending"
 });

 if(r.error){alert(r.error.message);return}

 alert("تم إرسال الطلب للمدير.");
 await logActivity("طلب تغيير كلمة المرور");
 requestPasswordPage();
}

/* إدارة طلبات تغيير كلمة المرور */

async function resetRequestsPage(){
 if(!requireTeacher())return;

 const r=await db.from("password_reset_requests")
  .select("*").order("created_at",{ascending:false});

 if(r.error){setContent(errorBox(r.error));return}

 setContent(`
  <h2>طلبات تغيير كلمات المرور</h2>
  ${(r.data||[]).map(x=>`
   <div class="item">
    <b>اسم المستخدم:</b> ${esc(x.username)}
    <br><b>الحالة:</b> ${esc(x.status)}
    <br><b>تاريخ الطلب:</b> ${esc(x.created_at)}
    ${x.status==="pending"?`<br><button class="secondary" onclick="rejectResetRequest(${Number(x.id)})">رفض الطلب</button>`:""}
    <p class="small">تغيير كلمة المرور فعليًا يحتاج ربط وظيفة reset-student-password.</p>
   </div>
  `).join("")||"<p>لا توجد طلبات.</p>"}
 `);
}

async function rejectResetRequest(id){
 if(!requireTeacher())return;

 const r=await db.from("password_reset_requests").update({
  status:"rejected",updated_at:new Date().toISOString()
 }).eq("id",id);

 if(r.error){alert(r.error.message);return}
 resetRequestsPage();
}

/* إعدادات الحساب */

async function settingsPage(){
 setContent(`
  <h2>إعدادات الحساب</h2>
  <label>الاسم بالكامل</label>
  <input id="settingsName" value="${esc(profile?.full_name||"")}">
  <label>اسم المستخدم</label>
  <input id="settingsUsername" value="${esc(profile?.username||"")}" readonly>
  <p class="small">تغيير اسم المستخدم يحتاج تحديث بيانات تسجيل الدخول أيضًا.</p>
  <button onclick="saveProfile()">حفظ الاسم</button>
  <hr><h2>تغيير كلمة المرور</h2>
  <input id="newPassword" type="password" placeholder="كلمة المرور الجديدة">
  <input id="confirmPassword" type="password" placeholder="تأكيد كلمة المرور">
  <button onclick="changeOwnPassword()">تغيير كلمة المرور</button>
 `);
}

async function saveProfile(){
 const full_name=$("settingsName").value.trim();
 if(!full_name){alert("اكتب الاسم.");return}

 const r=await db.from("profiles").update({full_name}).eq("id",user.id);
 if(r.error){alert(r.error.message);return}

 profile={...profile,full_name};
 $("welcome").textContent="أهلاً بك "+full_name;

 alert("تم تحديث الاسم.");
 await logActivity("تعديل الاسم",full_name);
}

async function changeOwnPassword(){
 const p=$("newPassword").value;
 const c=$("confirmPassword").value;

 if(p.length<8){alert("كلمة المرور يجب أن تكون 8 أحرف على الأقل.");return}
 if(p!==c){alert("كلمتا المرور غير متطابقتين.");return}

 const r=await db.auth.updateUser({password:p});
 if(r.error){alert(r.error.message);return}

 alert("تم تغيير كلمة المرور بنجاح.");
 $("newPassword").value="";
 $("confirmPassword").value="";
 await logActivity("تغيير كلمة المرور");
}

/* تسجيل الخروج واستعادة الجلسة */

async function logout(){
 await logActivity("تسجيل الخروج");
 await db.auth.signOut();
 location.reload();
}

if(db){
 db.auth.getSession().then(({data,error})=>{
  if(!error&&data.session)start(data.session.user);
 }).catch(error=>{
  console.error(error);
  message("loginMsg","تعذر استعادة الجلسة. يمكنك تسجيل الدخول من جديد.",true);
 });
}
